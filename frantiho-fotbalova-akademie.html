<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Frantiho fotbalová akademie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: celoobrazovkový večerní stadion (SVG svět, kamera = animovaný viewBox). Nahoře HUD, pod ním čtecí kartička, dole vysouvací panel s odpovědí. Jednotný noční vzhled. */
:root{
  --night:#060f26; --navy:#0c1c40; --glass:rgba(9,20,48,.86); --line:rgba(255,255,255,.16);
  --gold:#ffc23a; --gold-d:#b97d00; --red:#e5383b; --white:#ffffff; --ink:#0b1630;
  --ok:#2fd18b; --warn:#ff9f43; --info:#5aa9ff; --muted:#a8b7d9;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Baloo 2","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--white);font-family:var(--f-body);overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#vig{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,6,20,.55) 100%)}

/* cinematic */
.bar{position:absolute;left:0;right:0;height:11vh;background:#000;z-index:20;transition:transform .9s cubic-bezier(.7,0,.2,1);pointer-events:none}
.bar.top{top:0;transform:translateY(-100%)}.bar.bot{bottom:0;transform:translateY(100%)}
.cine .bar{transform:none}
#subs{position:absolute;left:50%;bottom:calc(11vh + 18px);transform:translateX(-50%);z-index:22;max-width:min(900px,calc(100% - 32px));text-align:center;font:800 clamp(1.3rem,2.6vw,2rem)/1.25 var(--f-body);text-shadow:0 2px 10px rgba(0,0,0,.9);padding:6px 18px;border-radius:14px;background:rgba(0,0,0,.35)}
#subs span{transition:color .15s}
#subs span.on{color:var(--gold)}
#skip{position:absolute;top:calc(11vh + 14px);right:16px;z-index:25;background:rgba(0,0,0,.45);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 18px;font-weight:800;font-size:1rem}
#skip:hover{border-color:var(--gold)}
#lower3{position:absolute;left:clamp(16px,4vw,60px);bottom:calc(11vh + 22px);z-index:22;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:l3in .7s cubic-bezier(.2,.9,.2,1)}
#lower3 .live{background:var(--red);padding:10px 14px;font:1.05rem/1 var(--f-display);display:flex;align-items:center;gap:8px;letter-spacing:.06em}
#lower3 .live i{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
#lower3 .tx{background:rgba(255,255,255,.95);color:var(--ink);padding:6px 16px;display:flex;flex-direction:column;justify-content:center}
#lower3 b{font:1.25rem/1.05 var(--f-display)}#lower3 small{font-weight:700;color:#4b5a7a;font-size:.85rem}
@keyframes l3in{from{transform:translateX(-30px);opacity:0}}
@keyframes blink{50%{opacity:.25}}

/* gate */
#gate{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding-inline:16px;background:radial-gradient(ellipse at 50% 60%,rgba(6,15,38,.35),rgba(6,15,38,.85))}
.gcard{text-align:center;display:grid;gap:18px;justify-items:center;max-width:640px}
.crest{width:120px;height:120px;filter:drop-shadow(0 10px 30px rgba(255,194,58,.35))}
.gtitle{margin:0;font:clamp(2.6rem,7vw,4.6rem)/.95 var(--f-display);text-shadow:0 6px 30px rgba(0,0,0,.6);text-wrap:balance}
.gtitle span{color:var(--gold)}
.gsub{margin:0;font-weight:700;font-size:1.15rem;color:var(--muted)}
.note{font-size:.95rem;color:var(--muted);margin:0}
.btn{border:0;border-radius:999px;padding:.55em 1.6em .45em;font:clamp(1.3rem,2.4vw,1.7rem)/1.1 var(--f-display);letter-spacing:.02em;transition:transform .12s, box-shadow .12s}
.btn.gold{background:linear-gradient(180deg,#ffd76b,var(--gold));color:var(--ink);box-shadow:0 6px 0 var(--gold-d),0 12px 30px rgba(255,194,58,.35)}
.btn.gold:hover{transform:translateY(-2px)}
.btn.gold:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.3)}
.btn.ghost:hover{border-color:var(--gold)}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;pointer-events:none;transition:opacity .6s}
#hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 16px 6px 8px;font:1.05rem/1 var(--f-display);backdrop-filter:blur(8px)}
.brand svg{width:34px;height:34px}
.score{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 18px;backdrop-filter:blur(8px)}
.score .rnd{font:1.05rem/1 var(--f-display);color:var(--muted)}
.score .rnd b{color:#fff}
.gl{display:flex;gap:6px}
.gl i{width:22px;height:22px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:block;transition:all .4s}
.gl i.on{border:0;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#dde4ef 60%,#9aa7bd);box-shadow:0 0 12px rgba(255,194,58,.8);position:relative}
.gl i.on::after{content:"";position:absolute;inset:6px;background:#1e293b;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.mini{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.95rem;backdrop-filter:blur(8px)}
.mini:hover{border-color:var(--gold)}
@media (max-width:720px){.brand span{display:none}.brand{padding:6px}}

/* reading card */
#readCard{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:14;background:#fff;color:var(--ink);border-radius:20px;padding:12px 26px 10px;font:800 clamp(1.4rem,2.8vw,2.1rem)/1.2 var(--f-body);box-shadow:0 14px 40px rgba(0,0,0,.45);max-width:calc(100% - 32px);text-align:center;text-wrap:balance}
#readCard.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}

#goalTxt{position:absolute;left:50%;top:34%;z-index:26;transform:translate(-50%,-50%);font:clamp(5rem,16vw,12rem)/1 var(--f-display);color:var(--gold);text-shadow:0 8px 0 #9a5d00,0 18px 50px rgba(0,0,0,.6);pointer-events:none;letter-spacing:.02em;animation:goal 1.6s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes goal{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.08) rotate(3deg);opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1}100%{transform:translate(-50%,-60%) scale(1.05);opacity:0}}
#goalTxt small{display:block;text-align:center;font-size:.32em;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.6);margin-top:.15em}
#letterPop{position:absolute;left:50%;top:42%;z-index:26;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;pointer-events:none;animation:lp 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
#letterPop span{font:800 1.4rem/1 var(--f-body);background:rgba(0,0,0,.5);padding:6px 16px;border-radius:999px}
#letterPop b{display:grid;place-items:center;min-width:2.2ch;height:1.6em;padding:0 .3em;font:clamp(5rem,13vw,9rem)/1 var(--f-display);color:var(--ink);background:linear-gradient(180deg,#ffe08a,var(--gold));border-radius:28px;box-shadow:0 10px 0 var(--gold-d),0 0 60px rgba(255,194,58,.7)}
@keyframes lp{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.06);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,40%) scale(.5);opacity:0}}

/* answer panel */
#panel{position:absolute;left:50%;bottom:0;z-index:16;width:min(1240px,calc(100% - 24px));max-height:60vh;overflow:auto;transform:translate(-50%,105%);transition:transform .6s cubic-bezier(.2,.9,.2,1);background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:16px 20px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;box-shadow:0 -20px 60px rgba(0,0,0,.4)}
#panel.open{transform:translate(-50%,0)}
.left{display:grid;gap:12px;min-width:0;align-content:start}
.task{display:flex;align-items:center;gap:14px}
.task p{margin:0;font:800 clamp(1.35rem,2.4vw,1.85rem)/1.2 var(--f-body)}
.boxes{display:flex;flex-wrap:wrap;gap:7px}
.bx{width:50px;height:58px;border-radius:14px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font:1.9rem/1 var(--f-display);text-align:center;padding:0;caret-color:var(--gold);transition:background .2s,border-color .2s,transform .2s}
.bx:focus{outline:none;border-color:var(--gold);background:rgba(255,194,58,.14);box-shadow:0 0 0 4px rgba(255,194,58,.2);transform:translateY(-2px)}
.bx.ok{border-color:var(--ok);background:rgba(47,209,139,.18)}
.bx.bad{border-color:var(--warn);background:rgba(255,159,67,.2);animation:wob .4s}
.bx.shown{border-color:var(--info);background:rgba(90,169,255,.25);color:#cfe5ff}
.bx.tgt{display:grid;place-items:center;border:0;background:linear-gradient(180deg,#ffe08a,var(--gold));color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
@keyframes wob{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg{margin:0;min-height:1.5em;font-weight:800;font-size:1.2rem}
.msg.ok{color:var(--ok)}.msg.warn{color:#ffc58a}.msg.info{color:#b8d8ff}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mic{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:none}
.mic svg{width:26px;height:26px}
.mic:hover{border-color:var(--gold)}
.mic.on{background:var(--red);border-color:#ff8a8c;animation:micp 1.3s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(229,56,59,.6)}50%{box-shadow:0 0 0 12px rgba(229,56,59,0)}}
.micSt{margin:0;font-weight:700;font-size:1.05rem;color:var(--muted);min-height:1.4em}
.micSt b{color:#fff}
.micSt.warn{color:#ffc58a}
.kb{display:grid;gap:6px;align-content:start}
.kb .r{display:flex;gap:6px;justify-content:center}
.k{min-width:40px;height:44px;padding:0 6px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#fff;font:1.3rem/1 var(--f-display);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.k:hover{background:rgba(255,255,255,.18)}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.k.wide{padding:0 12px;font:800 1rem/1 var(--f-body)}
.kbh{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
@media (max-width:1000px){#panel{grid-template-columns:minmax(0,1fr)}.bx{width:42px;height:50px;font-size:1.6rem}.k{min-width:32px;height:40px;font-size:1.1rem}}

/* finale */
#finale{position:absolute;inset:0;z-index:35;display:grid;place-items:center;padding-inline:16px;padding-block:20px;background:radial-gradient(ellipse at 50% 50%,rgba(6,15,38,.55),rgba(6,15,38,.9));overflow:auto}
.env{display:grid;justify-items:center;gap:16px;text-align:center}
.env h2{margin:0;font:clamp(2rem,5vw,3rem)/1 var(--f-display);color:var(--gold)}
.env p{margin:0;font-weight:800;font-size:1.3rem}
.envBtn{background:none;border:0;padding:0;animation:float 2.4s ease-in-out infinite}
.envBtn svg{width:min(320px,70vw);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
@keyframes float{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.reward{width:min(760px,100%);background:linear-gradient(180deg,#fffaf0,#fff2cf);color:var(--ink);border-radius:28px;padding:22px clamp(16px,3vw,32px) 24px;display:grid;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:rin .8s cubic-bezier(.2,1.2,.3,1)}
@keyframes rin{from{transform:translateY(60px) scale(.9);opacity:0}}
.rhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.rhead svg{width:110px;height:110px;flex:none}
.rhead h2{margin:0;font:clamp(1.9rem,4.5vw,2.6rem)/1 var(--f-display);color:#9a5d00}
.rhead p{margin:4px 0 0;font-weight:800;font-size:1.15rem;color:#5a4a2a}
.chal{background:#0c1c40;color:#fff;border-radius:20px;padding:16px 20px;display:grid;gap:8px}
.chal h3{margin:0;font:1.6rem/1.1 var(--f-display);color:var(--gold)}
.chal ol{margin:0;padding-left:1.4em;display:grid;gap:6px;font-weight:700;font-size:1.15rem}
.bonus{margin:0;font-weight:800;font-size:1.1rem}
.ract{display:flex;gap:12px;flex-wrap:wrap}
.reward .btn.ghost{color:var(--ink);background:transparent;border-color:rgba(11,22,48,.3)}
.reward .btn.ghost:hover{border-color:var(--gold-d)}
.champ{margin:0;font:1.6rem/1.15 var(--f-display);color:#1a7f50}

#ballWrap{cursor:pointer}
#aimRing{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
<svg id="world" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Fotbalový stadion">
  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081233"/><stop offset=".6" stop-color="#1b2d66"/><stop offset="1" stop-color="#4a4a8a"/></linearGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2540"/><stop offset="1" stop-color="#0a1022"/></linearGradient>
    <linearGradient id="gUpper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1634"/><stop offset="1" stop-color="#16295c"/></linearGradient>
    <linearGradient id="gLower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12245a"/><stop offset="1" stop-color="#1d3576"/></linearGradient>
    <linearGradient id="gBoard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a33"/><stop offset="1" stop-color="#050a16"/></linearGradient>
    <linearGradient id="gRay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8dc" stop-opacity=".16"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></linearGradient>
    <linearGradient id="gJersey" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b71f2a"/><stop offset=".45" stop-color="#ee3b44"/><stop offset="1" stop-color="#b71f2a"/></linearGradient>
    <linearGradient id="gKeeper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d98a06"/><stop offset=".5" stop-color="#ffc23a"/><stop offset="1" stop-color="#d98a06"/></linearGradient>
    <linearGradient id="gPost" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c3d6"/></linearGradient>
    <radialGradient id="gBall" cx=".38" cy=".35" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e4e9f2"/><stop offset="1" stop-color="#aab4c8"/></radialGradient>
    <radialGradient id="gBallShade" cx=".35" cy=".3" r=".85"><stop offset=".55" stop-color="#000a28" stop-opacity="0"/><stop offset="1" stop-color="#000a28" stop-opacity=".45"/></radialGradient>
    <radialGradient id="gLamp"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset=".35" stop-color="#fff2b8" stop-opacity=".45"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gPool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0" stop-opacity=".14"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
    <clipPath id="cBall"><circle r="1"/></clipPath>
    <clipPath id="cLed"><rect x="0" y="394" width="1600" height="32"/></clipPath>
    <clipPath id="cMouth"><path id="fMouthClip"/></clipPath>
  </defs>

  <!-- sky + roof -->
  <rect x="-400" y="-300" width="2400" height="420" fill="url(#gSky)"/>
  <g id="stars" fill="#fff"></g>
  <g id="masts"></g>
  <path d="M-400,74 Q800,58 2000,74 L2000,112 L-400,112Z" fill="url(#gRoof)"/>
  <path d="M-400,104 Q800,96 2000,104 L2000,114 L-400,114Z" fill="#05091a"/>
  <g id="roofLights"></g>
  <!-- stands -->
  <rect x="-400" y="112" width="2400" height="126" fill="url(#gUpper)"/>
  <rect x="-400" y="236" width="2400" height="27" fill="#070e24"/>
  <text x="800" y="256" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="17" fill="#ffc23a" letter-spacing="6">FRANTIHO FOTBALOVÁ AKADEMIE</text>
  <g id="exits"></g>
  <rect x="-400" y="263" width="2400" height="132" fill="url(#gLower)"/>
  <image id="crowdA" x="0" y="110" width="1600" height="285" preserveAspectRatio="none"/>
  <image id="crowdB" x="0" y="110" width="1600" height="285" preserveAspectRatio="none"/>
  <g id="flashes" fill="#fff"></g>
  <g id="rays" style="mix-blend-mode:screen"></g>
  <!-- pitch -->
  <image id="grass" x="-400" y="390" width="2400" height="560" preserveAspectRatio="none"/>
  <!-- ad boards -->
  <rect x="-400" y="392" width="2400" height="36" fill="url(#gBoard)"/>
  <g clip-path="url(#cLed)"><g id="led"><text id="ledText" x="0" y="418" font-family="Lilita One, sans-serif" font-size="22" fill="#fff" letter-spacing="2"></text></g></g>
  <rect x="-400" y="392" width="2400" height="2" fill="#2a3c6e"/>
  <g id="lines" fill="#fff" opacity=".88"></g>
  <ellipse cx="800" cy="640" rx="760" ry="230" fill="url(#gPool)"/>
  <g id="goalShadow" fill="#04220a" opacity=".22"></g>
  <ellipse id="ballShadow" fill="#03140a" opacity=".45"/>
  <!-- goal: net, ball-in-goal slot, posts -->
  <path id="netFill" fill="#fff" opacity=".06"/>
  <path id="netSide" fill="none" stroke="#fff" stroke-opacity=".33" stroke-width=".9"/>
  <path id="netBack" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width=".9"/>
  <g id="slotIn"></g>
  <g id="posts"></g>

  <!-- keeper -->
  <g id="keeperWrap">
    <ellipse cx="0" cy="0" rx="80" ry="13" fill="#000" opacity=".35"/>
    <g id="keeperBody">
      <path d="M-22,-122 L-52,-72" stroke="#111827" stroke-width="27" stroke-linecap="round"/>
      <path d="M22,-122 L52,-72" stroke="#111827" stroke-width="27" stroke-linecap="round"/>
      <path d="M-52,-72 L-44,-18" stroke="#ffc23a" stroke-width="21" stroke-linecap="round"/>
      <path d="M52,-72 L44,-18" stroke="#ffc23a" stroke-width="21" stroke-linecap="round"/>
      <path d="M-52,-58 L-50,-46" stroke="#111827" stroke-width="22"/>
      <path d="M52,-58 L50,-46" stroke="#111827" stroke-width="22"/>
      <ellipse cx="-50" cy="-8" rx="22" ry="10" fill="#0f172a"/><ellipse cx="50" cy="-8" rx="22" ry="10" fill="#0f172a"/>
      <path d="M-66,-8 h30" stroke="#ff4fa3" stroke-width="3" stroke-linecap="round"/><path d="M36,-8 h30" stroke="#ff4fa3" stroke-width="3" stroke-linecap="round"/>
      <path d="M-44,-160 H44 L50,-112 L14,-106 L0,-122 L-14,-106 L-50,-112Z" fill="#111827"/>
      <path d="M-49,-238 Q0,-252 49,-238 L47,-150 Q0,-142 -47,-150Z" fill="url(#gKeeper)"/>
      <path d="M-48,-206 L48,-226 L48,-212 L-47,-190Z M-47,-176 L47,-196 L47,-182 L-47,-162Z" fill="#111827" opacity=".85"/>
      <text x="0" y="-158" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="30" fill="#fff" stroke="#111827" stroke-width="5" paint-order="stroke">1</text>

<script>
(function(){
"use strict";
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const svg=$('#world');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- projection: camera 9 m behind the penalty spot ---------- */
const F=983.6,CAMH=4.68,ZC=20,HOR=250,CX=800;
const proj=(X,d,h=0)=>{const Z=ZC-d;return [CX+F*X/Z,HOR+F*(CAMH-h)/Z,Z];};
const lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),ios:t=>-(Math.cos(Math.PI*t)-1)/2,back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);},inq:t=>t*t,outq:t=>1-(1-t)*(1-t)};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const mk=(tag,at,p)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- tweens ---------- */
let tweens=[];
function tween(dur,fn,ease=E.io,tag=''){return new Promise(res=>{tweens.push({t0:performance.now(),dur:Math.max(1,dur),fn,ease,res,tag});});}
function killTweens(tag){tweens=tweens.filter(t=>{if(t.tag===tag){t.res();return false;}return true;});}
function runTweens(now){const list=tweens;tweens=[];for(const t of list){const p=Math.min(1,Math.max(0,(now-t.t0)/t.dur));t.fn(t.ease(p));if(p>=1)t.res();else tweens.push(t);}}

/* ---------- camera ---------- */
const cam={x:120,y:60,w:1360};let shake=0;
const frame=(cx,cy,w)=>({x:cx-w/2,y:cy-w*.5625/2,w});
function camTo(v,dur,ease=E.io,tag='cam'){const s={...cam};return tween(dur,p=>{cam.x=lerp(s.x,v.x,p);cam.y=lerp(s.y,v.y,p);cam.w=lerp(s.w,v.w,p);},ease,tag);}
function applyCam(now){const t=now/1000,a=RM?0:shake*cam.w*.0045;const ox=(Math.sin(t*.9)+.5*Math.sin(t*2.3+1))*a,oy=(Math.sin(t*1.13+2)+.5*Math.sin(t*2.9))*a*.7;svg.setAttribute('viewBox',`${(cam.x+ox).toFixed(2)} ${(cam.y+oy).toFixed(2)} ${cam.w.toFixed(2)} ${(cam.w*.5625).toFixed(2)}`);}

/* ---------- actors ---------- */
const BALL_R=.198,SPOT={X:0,d:11};
const START_B={X:-.6,d:12.2},INTRO_F={X:-.75,d:11.3};
const A={
  ball:{X:0,d:11,h:0,rot:0,vis:1,sc:1},
  keeper:{X:0,d:.6,h:0,rot:0,arms:0,clap:0,idle:1},
  boyF:{X:INTRO_F.X,d:INTRO_F.d,vis:1,flip:1,wave:0,jump:0,talk:0},
  boyB:{X:START_B.X,d:START_B.d,vis:0,flip:1,leg:0,arms:0,jump:0,lean:0}
};
const boyScale=Z=>(F/Z)*1.875/300;
function faceFrame(X,d,w=240){const[x,y,Z]=proj(X,d);return frame(x,y-268*boyScale(Z),w);}
function boyMedFrame(X,d,w=540){const[x,y,Z]=proj(X,d);return frame(x+40,y-120*boyScale(Z),w);}
const ballWrap=$('#ballWrap'),ballPat=$('#ballPat'),ballShadow=$('#ballShadow');
const keeperWrap=$('#keeperWrap'),keeperBody=$('#keeperBody'),kArmL=$('#kArmL'),kArmR=$('#kArmR');
const boyFWrap=$('#boyFWrap'),boyFIn=$('#boyFIn'),fArmR=$('#fArmR'),fArmL=$('#fArmL'),fHead=$('#fHead'),fEyes=$('#fEyes');
const boyBWrap=$('#boyBWrap'),boyBIn=$('#boyBIn'),pLegR=$('#pLegR'),pArmL=$('#pArmL'),pArmR=$('#pArmR');
const fMouth=$('#fMouth'),fMouthClip=$('#fMouthClip'),fTeeth=$('#fTeeth'),fTongue=$('#fTongue');
let mouth=0,mouthT=0,talking=false,nextFlap=0,blinkAt=2500,blinkStart=-1e9;

function renderActors(now){
  const b=A.ball,[bx,by,bz]=proj(b.X,b.d,b.h+BALL_R),r=F*BALL_R/bz*b.sc;
  ballWrap.setAttribute('transform',`translate(${bx.toFixed(2)},${by.toFixed(2)}) scale(${r.toFixed(3)})`);
  ballWrap.style.opacity=b.vis;ballPat.setAttribute('transform',`rotate(${(b.rot%360).toFixed(1)})`);
  const[sx,sy]=proj(b.X,b.d,0),hf=Math.max(.25,1-b.h*.35);
  ballShadow.setAttribute('cx',sx);ballShadow.setAttribute('cy',sy);ballShadow.setAttribute('rx',r*1.05*hf);ballShadow.setAttribute('ry',r*.3*hf);ballShadow.style.opacity=.45*hf*b.vis;
  const k=A.keeper;let kx=k.X,kh=k.h;if(k.idle){kx+=Math.sin(now/650)*.32*k.idle;kh+=Math.max(0,Math.sin(now/325))*.04*k.idle;}
  const[kxp,kyp,kz]=proj(kx,k.d,0),ks=(F/kz)*2.0/300;
  keeperWrap.setAttribute('transform',`translate(${kxp.toFixed(2)},${kyp.toFixed(2)}) scale(${ks.toFixed(4)})`);
  keeperBody.setAttribute('transform',`translate(0,${(-kh*150).toFixed(1)}) rotate(${k.rot.toFixed(1)} 0 -150)`);
  const clap=Math.sin(k.clap*Math.PI*4)*Math.min(1,k.clap*8)*(1-k.clap);
  kArmL.setAttribute('transform',`rotate(${(k.arms*115-clap*45).toFixed(1)} -44 -228)`);
  kArmR.setAttribute('transform',`rotate(${(-k.arms*115+clap*45).toFixed(1)} 44 -228)`);
  // front boy
  const f=A.boyF;boyFWrap.style.display=f.vis?'':'none';
  if(f.vis){const[fx,fy,fz]=proj(f.X,f.d),s=boyScale(fz),sway=Math.sin(now/950)*1.6;
    boyFWrap.setAttribute('transform',`translate(${(fx+sway*s).toFixed(2)},${fy.toFixed(2)}) scale(${(s*f.flip).toFixed(4)},${s.toFixed(4)})`);
    const br=1+Math.sin(now/700)*.008;boyFIn.setAttribute('transform',`translate(0,${-f.jump}) scale(1,${br})`);
    const w=f.wave?(-150+Math.sin(now/110)*16)*f.wave:0;fArmR.setAttribute('transform',`rotate(${w.toFixed(1)} 46 -210)`);
    fArmL.setAttribute('transform',`rotate(${(f.cheer||0)*150} -46 -210)`);
    const tilt=Math.sin(now/230)*2.4*f.talk+Math.sin(now/1300)*1.2;fHead.setAttribute('transform',`rotate(${tilt.toFixed(2)} 0 -236)`);
    if(now>blinkAt){blinkStart=now;blinkAt=now+2800+Math.random()*3200;}
    const bt=(now-blinkStart)/150;const bl=bt<1?1-Math.sin(bt*Math.PI)*.9:1;
    fEyes.setAttribute('transform',`translate(0,-274) scale(1,${bl.toFixed(2)}) translate(0,274)`);}
  // back boy
  const p=A.boyB;boyBWrap.style.display=p.vis?'':'none';
  if(p.vis){const[px,py,pz]=proj(p.X,p.d),s=boyScale(pz);

function buildNet(B,bx,bh){

  let s='';
  for(let X=-3.66;X<=3.67;X+=.3){s+='M';for(let h=0;h<=BH+.001;h+=.2)s+=(h?'L':'')+pt(back(X,Math.min(h,BH)));}
  for(let h=0;h<=BH+.001;h+=.25){s+='M';for(let X=-3.66;X<=3.67;X+=.3)s+=(X>-3.66?'L':'')+pt(back(X,h));}
  $('#netBack').setAttribute('d',s);
  let t='';const hT=d=>TOP+(BH-TOP)*(-d/2);
  for(const sx of[-3.66,3.66]){for(let d=0;d>=BD-.001;d-=.3)t+='M'+pt(proj(sx,d,0))+'L'+pt(proj(sx,d,hT(d)));
    for(let h=0;h<TOP;h+=.25){const dm=h<=BH?BD:-2*(TOP-h)/(TOP-BH);t+='M'+pt(proj(sx,0,h))+'L'+pt(proj(sx,dm,h));}}
  for(let X=-3.66;X<=3.67;X+=.3)t+='M'+pt(proj(X,0,TOP))+'L'+pt(back(X,BH));
  for(let d=0;d>=BD;d-=.4)t+='M'+pt(proj(-3.66,d,hT(d)))+'L'+pt(proj(3.66,d,hT(d)));
  $('#netSide').setAttribute('d',t);
  $('#netFill').setAttribute('d',`M${pt(back(-3.66,0))} L${pt(back(3.66,0))} L${pt(back(3.66,BH))} L${pt(back(-3.66,BH))}Z`);
}

function flash(id,ms){const e=$(id);e.hidden=false;e.style.animation='none';void e.offsetWidth;e.style.animation='';setTimeout(()=>e.hidden=true,ms);}
function setGoals(){[...$('#goals').children].forEach((g,i)=>g.classList.toggle('on',i<G.goals));$('#rnd').textContent=Math.min(5,G.round+1);}
function cine(on){$('#app').classList.toggle('cine',on);}

/* ---------- game data ---------- */
const ALPHA=['A','B','C','Č','D','Ď','E','F','G','H','Ch','I','J','K','L','M','N','Ň','O','P','Q','R','Ř','S','Š','T','Ť','U','V','W','X','Y','Z','Ž'];

const GOALL=['Gól! Brankář skočil na druhou stranu.','Gól! Míč letí přímo do sítě.','Gól! Celý stadion tleská.','Gól! Brankář se jen ohlédl.','Gól! Fanoušci zpívají tvé jméno.'];
const PRAISE1=['Výborně! Všech {n} písmen je na svém místě.','Paráda! Celá řada sedí napoprvé.','Přesně tak! Abecedu až po {L} zvládáš.'];
const PRAISE2=['Opravil jsi to sám. Teď je celá řada správně!','Super! Našel jsi, co chybělo, a řada sedí.','Výborně! Nevzdal ses a máš to správně.'];
const FAIL1=['Skoro! Oranžová písmenka ještě oprav.','Většina už sedí. Podívej se na oranžové čtverečky.','Dobrý začátek! Oranžové čtverečky zkus ještě jednou.'];
const G={round:0,goals:0,mode:'gate',phase:'',target:'',n:0,att:0,letters:0,clean:0};

/* ---------- intro ---------- */
let introTok=0;
async function playIntro(){
  const tk=++introTok,alive=()=>tk===introTok;G.mode='intro';
  resetActors();A.boyF.vis=1;A.boyB.vis=0;Object.assign(A.boyF,{X:INTRO_F.X,d:INTRO_F.d,flip:1,wave:0,jump:0});
  $('#hud').hidden=true;hideRead();cine(true);$('#skip').hidden=false;
  shake=1;Object.assign(cam,{x:1010,y:-40,w:560});
  $('#lower3').hidden=false;
  const T='intro';
  camTo({x:220,y:-10,w:620},3600,E.ios,T);
  await sleep(1600);if(!alive())return;snd.whistle(1);
  await sleep(2000);if(!alive())return;
  await camTo({x:60,y:40,w:1480},1700,E.io,T);if(!alive())return;
  $('#lower3').hidden=true;
  await camTo(boyMedFrame(INTRO_F.X,INTRO_F.d),1300,E.io,T);if(!alive())return;
  // line 1: wave + push in on face
  A.boyF.wave=1;camTo(faceFrame(INTRO_F.X,INTRO_F.d,250),2800,E.ios,T);
  await speak('Ahoj! Vítej ve Frantiho fotbalové akademii!');if(!alive())return;
  tween(300,p=>A.boyF.wave=1-p,E.io,T);
  // line 2: ball then goal
  const[bx,by]=proj(0,11,BALL_R);camTo(frame(bx,by-6,190),900,E.io,T);
  tapBall(T);
  const l2=speak('Dneska si spolu zastřílíme na branku');
  await sleep(1300);if(!alive())return;camTo(frame(800,420,720),1500,E.io,T);
  await l2;if(!alive())return;
  // line 3: letters around the boy
  const mf=boyMedFrame(INTRO_F.X,INTRO_F.d,600);mf.x-=40;mf.y-=40;camTo(mf,900,E.io,T);showLetters();
  await speak('a procvičíme českou abecedu.');if(!alive())return;
  // line 4: keeper close-up, then back to the boy
  hideLetters();const[kx,ky,kz]=proj(0,.6);camTo(frame(kx,ky-150*(F/kz)*2/300,230),700,E.out,T);
  tween(1400,p=>A.keeper.clap=p,E.lin,T);
  const l4=speak('Tak pojď, ukážeme brankáři, co umíš!');
  await sleep(1350);if(!alive())return;camTo(faceFrame(INTRO_F.X,INTRO_F.d,300),800,E.io,T);
  await l4;if(!alive())return;A.keeper.clap=0;hideSubs();
  // turn around, glide into the game view
  await turnToGame(T);if(!alive())return;
  enterGame(false);
}
function tapBall(T){tween(1100,p=>{A.ball.h=Math.abs(Math.sin(p*Math.PI*2))*.35*(1-p*.4);A.ball.rot=p*300;},E.lin,T);}
function showLetters(){const g=$('#floatL'),[x,y,Z]=proj(INTRO_F.X,INTRO_F.d),s=boyScale(Z),hy=y-268*s;
  const n=g.children.length;[...g.children].forEach((t,i)=>{const a=Math.PI*(1.08+i*.84/(n-1));t.setAttribute('x',(x+Math.cos(a)*150).toFixed(1));t.setAttribute('y',(hy-10+Math.sin(a)*105).toFixed(1));t.style.opacity=0;t.style.transition='opacity .35s';setTimeout(()=>t.style.opacity=1,i*170);});
  g.setAttribute('opacity',1);}
function hideLetters(){$('#floatL').setAttribute('opacity',0);}
async function turnToGame(T){
  await tween(220,p=>A.boyF.flip=1-p,E.inq,T);
  A.boyF.vis=0;Object.assign(A.boyB,{vis:1,X:INTRO_F.X,d:INTRO_F.d,flip:0});
  tween(220,p=>A.boyB.flip=p,E.outq,T);
  tween(1600,p=>{A.boyB.X=lerp(INTRO_F.X,START_B.X,p);A.boyB.d=lerp(INTRO_F.d,START_B.d,p);},E.io,T);
  cine(false);
  await camTo({x:0,y:0,w:1600},2200,E.io,T);
}
function skipIntro(){if(G.mode!=='intro')return;introTok++;killTweens('intro');if('speechSynthesis'in window)speechSynthesis.cancel();talking=false;hideSubs();hideLetters();$('#lower3').hidden=true;enterGame(true);}
$('#skip').onclick=skipIntro;

function resetActors(){Object.assign(A.ball,{X:SPOT.X,d:SPOT.d,h:0,rot:0,vis:1,sc:1});$('#slotFront').prepend(ballWrap);
  Object.assign(A.keeper,{X:0,d:.6,h:0,rot:0,arms:0,clap:0,idle:1});
  Object.assign(A.boyB,{X:START_B.X,d:START_B.d,flip:1,leg:0,arms:0,jump:0,lean:0});}
function enterGame(fast){
  G.mode='game';cine(false);shake=0;$('#skip').hidden=true;hideSubs();
  A.boyF.vis=0;A.boyB.vis=1;resetActors();A.keeper.clap=0;
  if(fast)camTo({x:0,y:0,w:1600},700,E.io);
  $('#hud').hidden=false;setGoals();startRound();
}

/* ---------- rounds ---------- */
function startRound(){
  G.phase='aim';const pool=ROUNDS[G.round];G.target=pick(pool);const sv=SAVES[G.round];G.savesLeft=sv[0]+Math.floor(Math.random()*(sv[1]-sv[0]+1));
  setGoals();showRead(AIM[G.round]);ballWrap.classList.add('aim');$('#aimRing').style.display='';
  svg.style.cursor='';
}
ballWrap.addEventListener('click',()=>{if(G.mode==='game'&&G.phase==='aim')shoot();});
/* shot types: keeper always dives toward the ball's side (or is beaten another way) */
const SHOTS={
  vysoko:{label:'DO ŠIBENICE!',line:'Gól! Míč proletěl brankáři nad rukavicemi.'},
  nizko:{label:'K TYČI!',line:'Gól! Brankář skočil, ale míč proletěl pod ním.'},
  gajdy:{label:'GAJDY!',line:'Gól! Míč proletěl brankáři mezi nohama. Tomu se říká gajdy!'},
  dlouba:{label:'DLOUBÁK!',line:'Brankář skočil stranou a míč šel doprostřed. To byl dloubák!'},
  falš:{label:'FALŠ!',line:'Gól! Míč se zatočil kolem rukavic. To byla falšovaná střela!'}
};
function shotOrder(){const o=['vysoko','nizko','falš','dlouba'].sort(()=>Math.random()-.5);o.splice(1+Math.floor(Math.random()*3),0,'gajdy');return o;}
G.shots=shotOrder();
function keeperDive(side,{X=1.9,rot=74,lift=.5,dur=560,delay=110}={}){return sleep(delay).then(()=>{A.keeper.idle=0;const k0=A.keeper.X;
  return tween(dur,p=>{A.keeper.X=lerp(k0,side*X,E.out(p));A.keeper.rot=side*rot*E.out(p);A.keeper.arms=Math.min(1,p*2);A.keeper.h=Math.sin(p*Math.PI)*lift;},E.lin);});}
const SAVES=[[1,2],[2,3],[2,4],[3,4],[3,5]];
const SAVE_LINES=['Chytil! Brankář je dnes rychlý. Zkus to znovu.','Zákrok! Brankář míč chytil. Vystřel ještě jednou.','Brankář se natáhl a míč chytil. Další střela!','Těsně! Brankář byl rychlejší. Zkus to znovu.','Brankář má dobrý den. Ale ty to nevzdáš!'];
function gloveMid(){const k=A.keeper,a=k.arms*115*Math.PI/180,r=k.rot*Math.PI/180;
  const arm=(sx,sign)=>{const vx=67*sx,vy=81,an=-sign*a;return[44*sx+vx*Math.cos(an)-vy*Math.sin(an),-228+vx*Math.sin(an)+vy*Math.cos(an)];};
  const L=arm(-1,-1),Rr=arm(1,1),mx=(L[0]+Rr[0])/2,my=(L[1]+Rr[1])/2+20;
  const rx=mx*Math.cos(r)-(my+150)*Math.sin(r),ry=mx*Math.sin(r)+(my+150)*Math.cos(r)-150-k.h*150;
  return{X:k.X+rx/150,h:Math.max(0,-ry/150-BALL_R)};}
async function save(){
  const side=Math.random()<.5?-1:1,kind=pick(['side','side','low','middle']);
  await tween(430,p=>{A.boyB.X=lerp(START_B.X,-.33,p);A.boyB.d=lerp(START_B.d,11.45,p);A.boyB.jump=Math.abs(Math.sin(p*Math.PI*3))*8;A.boyB.lean=p*-4;},E.lin);
  snd.kick();tween(380,p=>{A.boyB.leg=Math.sin(p*Math.PI);},E.lin);
  A.keeper.idle=0;const k0=A.keeper.X;
  if(kind==='middle')tween(500,p=>{A.keeper.X=lerp(k0,0,p);A.keeper.arms=-.12*p;},E.out);
  else if(kind==='low')tween(560,p=>{A.keeper.X=lerp(k0,side*1.7,E.out(p));A.keeper.rot=side*86*E.out(p);A.keeper.arms=Math.min(1,p*2);A.keeper.h=Math.sin(p*Math.PI)*.18;},E.lin);
  else tween(600,p=>{A.keeper.X=lerp(k0,side*1.8,E.out(p));A.keeper.rot=side*70*E.out(p);A.keeper.arms=Math.min(1,p*2);A.keeper.h=Math.sin(p*Math.PI)*.55;},E.lin);
  await tween(kind==='middle'?520:600,p=>{const g=gloveMid();A.ball.X=lerp(0,g.X,p);A.ball.h=lerp(0,g.h,p)+Math.sin(Math.PI*p)*(kind==='low'?.1:.5);A.ball.d=lerp(11,.75,p);A.ball.rot+=14;},E.outq);
  snd.glove();snd.ooh();
  // hold the ball while the keeper lands
  const hold=tween(700,()=>{const g=gloveMid();A.ball.X=g.X;A.ball.h=g.h;},E.lin);
  tween(400,p=>{A.keeper.h=A.keeper.h*(1-p);},E.io);
  tween(600,p=>{A.boyB.leg=0;A.boyB.lean=0;A.boyB.jump=0;A.boyB.arms=Math.sin(p*Math.PI)*.35;},E.lin);
  await hold;showRead(pick(SAVE_LINES));
  const kr=A.keeper.rot,ka=A.keeper.arms;
  await tween(650,p=>{A.keeper.rot=lerp(kr,0,p);A.keeper.arms=lerp(ka,0,p);A.keeper.h=0;const g=gloveMid();A.ball.X=g.X;A.ball.h=g.h;},E.io);
  await sleep(350);
  // keeper rolls the ball back to the spot
  const bx=A.ball.X,bh=A.ball.h,bxk=A.keeper.X;
  tween(1400,p=>{A.boyB.X=lerp(-.33,START_B.X,p);A.boyB.d=lerp(11.45,START_B.d,p);},E.io);
  tween(900,p=>{A.keeper.X=lerp(bxk,0,p);},E.io).then(()=>A.keeper.idle=1);
  await tween(1300,p=>{A.ball.X=lerp(bx,0,p);A.ball.h=bh*(1-Math.min(1,p*4));A.ball.d=lerp(.75,11,p);A.ball.rot-=9;},E.outq);
  Object.assign(A.ball,{X:0,d:11,h:0});
  G.savesLeft--;G.phase='aim';$('#aimRing').style.display='';
}
async function shoot(){
  G.phase='shoot';hideRead();$('#aimRing').style.display='none';
  if(G.savesLeft>0){await save();return;}
  const type=G.shots[G.round%5],side=Math.random()<.5?-1:1;G.shot=type;
  if(type==='gajdy'){A.keeper.idle=0;const k0=A.keeper.X;tween(300,p=>A.keeper.X=lerp(k0,0,p));}
  await tween(430,p=>{A.boyB.X=lerp(START_B.X,-.33,p);A.boyB.d=lerp(START_B.d,11.45,p);A.boyB.jump=Math.abs(Math.sin(p*Math.PI*3))*8;A.boyB.lean=p*-4;},E.lin);
  if(type==='dlouba'){snd.tone(180,.15,.25,0,'sine',90);}else snd.kick();
  tween(380,p=>{A.boyB.leg=Math.sin(p*Math.PI);},E.lin);
  let path,dur=640,ease=E.outq,layerD=0,end;
  if(type==='vysoko'){keeperDive(side,{X:1.7,rot:68,lift:.45});end={X:side*2.85,h:2.12};path=p=>({X:end.X*p,h:end.h*p+Math.sin(Math.PI*p)*.7});}
  else if(type==='nizko'){keeperDive(side,{X:1.8,rot:82,lift:.95,dur:600,delay:60});end={X:side*2.7,h:0};path=p=>({X:end.X*p,h:Math.sin(Math.PI*p)*.12});}
  else if(type==='falš'){keeperDive(side,{X:1.85,rot:72,lift:.5,delay:200});end={X:side*3.2,h:1.0};dur=760;path=p=>({X:end.X*p+side*1.5*Math.sin(Math.PI*p),h:end.h*p+Math.sin(Math.PI*p)*.9});}
  else if(type==='gajdy'){end={X:0,h:0};layerD=.75;path=p=>({X:0,h:0});
    setTimeout(()=>tween(500,p=>{A.keeper.arms=-.25*Math.sin(p*Math.PI);A.keeper.h=Math.sin(p*Math.PI)*.18;},E.lin),330);}
  else{keeperDive(side,{X:2.0,rot:80,lift:.4,delay:0,dur:520});end={X:side*.15,h:1.5};dur=1150;ease=E.lin;path=p=>({X:end.X*p,h:end.h*p+Math.sin(Math.PI*p)*2.1});}
  let moved=false;
  await tween(dur,p=>{const q=path(p);A.ball.X=q.X;A.ball.h=q.h;A.ball.d=lerp(11,-1.55,p);A.ball.rot+=(type==='dlouba'?5:14)*(type==='falš'?side:1);
    if(!moved&&A.ball.d<layerD){moved=true;$('#slotIn').appendChild(ballWrap);}},ease);
  startRipple(end.X,Math.max(.3,end.h));snd.swish();
  tween(420,p=>{A.ball.d=-1.55-.25*p;A.ball.h=end.h*(1-E.inq(p));A.ball.rot+=4;},E.lin);
  goal();
}
async function goal(){
  G.goals++;setGoals();snd.cheer(1.1,3.2);snd.whistle(1);crowdParty(2600);led('GÓÓÓL!');
  $('#goalKind').textContent=SHOTS[G.shot].label;flash('#goalTxt',1700);confetti(170);
  camTo({x:90,y:40,w:1420},260,E.out).then(()=>camTo({x:0,y:0,w:1600},700,E.io));
  tween(1200,p=>{A.boyB.arms=Math.min(1,p*3);A.boyB.jump=Math.abs(Math.sin(p*Math.PI*3))*30;A.boyB.leg=0;A.boyB.lean=0;},E.lin);
  await sleep(1500);showRead(SHOTS[G.shot].line);
  const kr=A.keeper.rot,ka=A.keeper.arms;tween(900,p=>{A.keeper.rot=lerp(kr,0,p);A.keeper.h=0;A.keeper.arms=lerp(ka,0,p);},E.io).then(()=>{tween(700,p=>{A.keeper.X=lerp(A.keeper.X,0,p);},E.io).then(()=>A.keeper.idle=1);});
  tween(500,p=>A.boyB.arms=1-p);
  await sleep(2000);
  $('#lpL').textContent=G.target;flash('#letterPop',1500);snd.chime();
  await sleep(1250);hideRead();openPanel();
}

/* ---------- answer panel ---------- */
let inputs=[],activeIdx=0,locked=false;
const KB=[['Č','Ď','Ň','Ř','Š','Ť','Ž'],['Q','W','E','R','T','Z','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Y','X','C','V','B','N','M'],['Ch','⌫']];
(function buildKb(){const kb=$('#kb');KB.forEach(r=>{const row=document.createElement('div');row.className='r';r.forEach(l=>{const b=document.createElement('button');b.className='k'+(l.length>1?' wide':'');b.textContent=l==='⌫'?'Smazat':l;b.dataset.l=l;b.type='button';row.appendChild(b);});kb.appendChild(row);});
  const h=document.createElement('p');h.className='kbh';h.textContent='Piš na klávesnici, nebo klikej na písmena.';kb.appendChild(h);
  kb.addEventListener('mousedown',e=>{if(e.target.closest('.k'))e.preventDefault();});
  kb.addEventListener('click',e=>{const b=e.target.closest('.k');if(!b||locked)return;const l=b.dataset.l;
    if(l==='⌫'){const i=activeIdx;if(inputs[i].value){inputs[i].value='';clean(i);}else if(i>0){inputs[i-1].value='';clean(i-1);focusBox(i-1);}snd.key();return;}
    put(activeIdx,l);});})();
function openPanel(){
  G.phase='answer';G.att=0;locked=false;const idx=ALPHA.indexOf(G.target);G.n=idx+1;
  $('#taskText').textContent=`Napiš abecedu od A až po ${G.target}.`;
  const bx=$('#boxes');bx.innerHTML='';inputs=[];
  for(let i=0;i<idx;i++){const inp=document.createElement('input');inp.className='bx';inp.id='bx'+i;inp.setAttribute('autocomplete','off');inp.setAttribute('autocapitalize','characters');inp.spellcheck=false;inp.setAttribute('aria-label',`Písmeno ${i+1}`);
    inp.addEventListener('pointerdown',()=>{dictFull=false;cur.idx=-1;});
    inp.addEventListener('focus',()=>{activeIdx=i;setTimeout(()=>{if(document.activeElement===inp)inp.select();},0);});
    inp.addEventListener('beforeinput',e=>{if(locked){e.preventDefault();return;}if(e.inputType==='insertText'&&e.data){e.preventDefault();const v=norm(e.data);if(v)put(i,v.endsWith('CH')?'Ch':v.slice(-1));}});
    inp.addEventListener('input',e=>{if(e.isComposing)return;handleInput(i);});
    inp.addEventListener('compositionend',e=>{const v=norm(e.data||'');if(v){inputs[i].value='';put(i,v.slice(-1));}else handleInput(i);});
    inp.addEventListener('keydown',e=>onBoxKey(e,i));
    bx.appendChild(inp);inputs.push(inp);}
  const t=document.createElement('div');t.className='bx tgt';t.textContent=G.target;t.title='Tvoje písmeno';bx.appendChild(t);
  $('#msg').textContent='';$('#msg').className='msg';$('#done').hidden=false;$('#next').hidden=true;
  $('#panel').classList.add('open');camTo({x:250,y:200,w:1100},900,E.io);
  setTimeout(()=>{if(!inputs.includes(document.activeElement))focusBox(0);dictFull=false;cur.idx=-1;if(micPref){micListen();snd.duck(true);if(rec)micSt('Poslouchám. Říkej písmena nahlas, jedno po druhém.');}},650);
  if(!micPref)micSt(SR?'Klikni na Diktovat a říkej písmena nahlas: á, bé, cé…':'Diktování umí prohlížeč Chrome nebo Edge. Tady piš na klávesnici.',SR?'':'warn');
}
/* dictation: Czech letter names -> letters */
const NAMES={};
[['A','a á aa ah'],['B','b bé be bý'],['C','c cé ce'],['Č','č čé če čo'],['D','d dé de'],['Ď','ď ďé ďe dě dje'],['E','e é ee éé'],['F','f ef eff'],['G','g gé ge'],
 ['H','h há ha'],['Ch','ch chá cha chá'],['I','i í ii'],['J','j jé je'],['K','k ká ka'],['L','l el ell'],['M','m em emm'],['N','n en enn'],['Ň','ň eň ně'],['O','o ó oo'],
 ['P','p pé pe'],['Q','q kvé kve kú'],['R','r er err'],['Ř','ř eř'],['S','s es ess'],['Š','š eš'],['T','t té te'],['Ť','ť ťé tě tje'],['U','u ú ů'],['V','v vé ve'],
 ['W','w dvé'],['X','x iks ix'],['Y','y'],['Z','z zet zed'],['Ž','ž žet']].forEach(([L,ws])=>ws.split(' ').forEach(w=>NAMES[w]=L));
function parseLetters(raw){
  let t=' '+raw.replace(/[.,!?;:"'„“()]/g,' ').replace(/-/g,' ')+' ';
  const out=[];
  t=t.replace(/dvojit\S*\s+v\S*/gi,' W ').replace(/tvrd\S*\s+[yý]\b/gi,' Y ').replace(/m[ěe]kk\S*\s+[ií]\b/gi,' I ').replace(/[iy]psilon|ypsylon/gi,' Y ');
  for(const w0 of t.split(/\s+/)){if(!w0)continue;const w=w0.toLocaleLowerCase('cs-CZ');
    if(/^(smazat|smaž|zpět|zpátky)$/.test(w)){out.push('⌫');continue;}
    if(/^(hotovo|konec)$/.test(w)){out.push('✓');continue;}
    if(NAMES[w]){out.push(NAMES[w]);continue;}
    if(w0.length>=2&&w0.length<=6&&w0===w0.toLocaleUpperCase('cs-CZ')&&/^\p{L}+$/u.test(w0)){ // "ABC" style
      for(let i=0;i<w.length;i++){if(w[i]==='c'&&w[i+1]==='h'){out.push('Ch');i++;continue;}const L=NAMES[w[i]];if(L)out.push(L);}}
  }
  return out;}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,micPref=false,micBlocked=false,dictFull=false,cur={idx:-1,start:0,done:[]};
const isL=x=>x!=='⌫'&&x!=='✓';
/* write letters as soon as the recognizer hears them (interim results), fix them if the final text differs */
function applyLetters(ls){for(let k=0;k<ls.length;k++){const t=cur.start+k;
  if(t>=inputs.length){dictFull=true;micSt('Všechna okýnka jsou vyplněná. Řekni „hotovo“, nebo klikni na Hotovo.');return;}
  if(k<cur.done.length){if(cur.done[k]!==ls[k]){inputs[t].value=ls[k];clean(t);cur.done[k]=ls[k];}continue;}
  inputs[t].value=ls[k];clean(t);cur.done.push(ls[k]);snd.key();
  if(t+1<inputs.length)focusBox(t+1);else{dictFull=true;focusBox(t);}}}
function micSt(html,cls=''){const m=$('#micSt');m.innerHTML=html;m.className='micSt '+cls;}
function micUi(on){const b=$('#mic');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);$('#micTx').textContent=on?'Poslouchám…':'Diktovat';}
function micListen(){
  if(!SR){micSt('Diktování umí prohlížeč Chrome nebo Edge. Tady piš na klávesnici.','warn');micPref=false;return;}
  if(rec||micBlocked)return;
  const r=new SR();rec=r;r.lang='cs-CZ';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
  r.onstart=()=>{micUi(true);snd.duck(G.phase==='answer');if(G.phase==='answer')micSt('Říkej písmena nahlas, jedno po druhém.');};
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];
    if(G.phase!=='answer'||locked){cur.idx=-1;continue;}
    if(cur.idx!==i)cur={idx:i,start:dictFull?inputs.length:activeIdx,done:[]};
    let heard=res[0].transcript,letters=parseLetters(heard);
    if(res.isFinal)for(const alt of res){const l=parseLetters(alt.transcript);if(l.filter(isL).length>letters.filter(isL).length){letters=l;heard=alt.transcript;}}
    applyLetters(letters.filter(isL));
    if(res.isFinal){
      for(const c of letters.filter(x=>!isL(x))){if(c==='✓'){check();}else{dictFull=false;const k=activeIdx;if(inputs[k]&&inputs[k].value&&(k===inputs.length-1)){inputs[k].value='';clean(k);}else if(k>0){inputs[k-1].value='';clean(k-1);focusBox(k-1);}}}
      if(!letters.length&&heard.trim())micSt('Slyšel jsem „'+esc(heard)+'“. Zkus písmeno říct znovu, třeba „bé“.');
      cur.idx=-2-i;}
    if(letters.length&&!dictFull)micSt('Slyším: <b>'+esc(heard)+'</b> → '+letters.filter(isL).join(' '));}};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micBlocked=true;micPref=false;
      micSt('Mikrofon tu není povolený. V náhledu v Claude diktování nefunguje. Otevři hru jako samostatnou stránku v Chrome nebo Edge a mikrofon povol.','warn');}
    else if(e.error==='network')micSt('Diktování potřebuje internet. Zatím piš na klávesnici.','warn');
    else if(e.error==='audio-capture'){micPref=false;micSt('Nenašel jsem mikrofon. Zkontroluj, že je připojený.','warn');}};
  r.onend=()=>{if(rec===r)rec=null;if(micPref&&!micBlocked){setTimeout(micListen,150);}else{micUi(false);snd.duck(false);}};
  try{r.start();}catch(err){rec=null;}
}
function micStop(){const r=rec;rec=null;if(r){r.onend=null;try{r.abort();}catch(e){}}micUi(false);snd.duck(false);}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
$('#mic').addEventListener('mousedown',e=>e.preventDefault());
$('#mic').onclick=()=>{if(rec||micPref){micPref=false;micStop();micSt('Diktování je vypnuté. Můžeš psát na klávesnici.');return;}
  if(micBlocked){micSt('Mikrofon tu není povolený. Otevři hru jako samostatnou stránku v Chrome nebo Edge a mikrofon povol.','warn');return;}
  micPref=true;micListen();};
function focusBox(i){if(inputs[i]){inputs[i].focus({preventScroll:true});activeIdx=i;}}
function clean(i){inputs[i].classList.remove('ok','bad','shown');}
function norm(v){return v.toLocaleUpperCase('cs-CZ').replace(/[^\p{L}]/gu,'');}
function handleInput(i){if(locked)return;const el=inputs[i];let v=norm(el.value);
  if(!v){el.value='';clean(i);return;}
  v=v.endsWith('CH')?'Ch':v.slice(-1);
  put(i,v);}
function put(i,v){const el=inputs[i];if(!el)return;
  if(v==='H'&&i>0&&inputs[i-1].value==='C'){inputs[i-1].value='Ch';clean(i-1);el.value='';clean(i);snd.key();focusBox(i);return;}
  if(v==='H'&&el.value==='C')v='Ch';
  el.value=v;clean(i);snd.key();
  if(i+1<inputs.length)focusBox(i+1);else{el.focus({preventScroll:true});setTimeout(()=>{if(document.activeElement===el)el.select();},0);}}
function onBoxKey(e,i){
  if(e.key==='Backspace'&&!inputs[i].value&&i>0){e.preventDefault();inputs[i-1].value='';clean(i-1);focusBox(i-1);}
  else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();focusBox(i-1);}
  else if(e.key==='ArrowRight'&&i+1<inputs.length){e.preventDefault();focusBox(i+1);}
  else if(e.key==='Enter'){e.preventDefault();check();}
  else if(e.key===' '){e.preventDefault();}
}
function say(t,cls){const m=$('#msg');m.textContent=t;m.className='msg '+cls;}
$('#done').onclick=check;
function check(){
  if(locked||G.phase!=='answer')return;
  const vals=inputs.map(i=>i.value),empty=vals.filter(v=>!v).length;
  if(empty){say(empty===1?'Ještě zbývá doplnit 1 čtvereček.':empty<5?`Ještě zbývá doplnit ${empty} čtverečky.`:`Ještě zbývá doplnit ${empty} čtverečků.`,'info');focusBox(vals.findIndex(v=>!v));return;}
  G.att++;const wrong=[];
  vals.forEach((v,i)=>{const ok=v===ALPHA[i];inputs[i].classList.toggle('ok',ok);inputs[i].classList.toggle('bad',!ok);if(!ok)wrong.push(i);});
  if(!wrong.length)return success();
  if(G.att>=3)return reveal(wrong);
  snd.soft();
  const hacek=wrong.some(i=>'ČĎŇŘŠŤŽ'.includes(ALPHA[i])&&vals[i]===ALPHA[i+1]);
  if(G.att===1)say(hacek?'Skoro! Nezapomeň na písmena s háčkem, třeba Č nebo Ď.':(wrong.length<=vals.length/2?pick(FAIL1):'Dobrý začátek! Oranžové čtverečky zkus ještě jednou. Začni písmenem A.'),'warn');
  else{const i=wrong[0];say('Zkus to ještě jednou. '+(i===0?'Abeceda začíná písmenem A.':`Nápověda: po písmenu ${ALPHA[i-1]} přichází ${ALPHA[i]}.`),'warn');}
  focusBox(wrong[0]);
}
function success(){
  G.letters+=G.n;if(G.att===1)G.clean++;
  const t=(G.att===1?pick(PRAISE1):pick(PRAISE2)).replace('{n}',G.n).replace('{L}',G.target);say(t,'ok');
  snd.win();snd.cheer(.7,2.2);crowdParty(1600);confetti(120,innerWidth/2,innerHeight*.45);
  tween(1000,p=>{A.boyB.arms=p<.8?Math.min(1,p*4):(1-p)*5;A.boyB.jump=Math.abs(Math.sin(p*Math.PI*2))*24;},E.lin);
  finishRound();
}
function reveal(wrong){
  G.letters+=G.n;wrong.forEach(i=>{inputs[i].value=ALPHA[i];inputs[i].classList.remove('bad');inputs[i].classList.add('shown');});
  say('Tady je celá řada. Modrá písmenka si dobře prohlédni, příště je najdeš sám.','info');snd.soft();finishRound();
}
function finishRound(){locked=true;dictFull=false;cur.idx=-1;snd.duck(false);G.phase='result';inputs.forEach(i=>i.readOnly=true);$('#done').hidden=true;const n=$('#next');n.hidden=false;n.textContent=G.round<4?'Hrajeme dál!':'Na závěrečný hvizd!';setTimeout(()=>n.focus({preventScroll:true}),50);}
$('#next').onclick=async()=>{
  $('#panel').classList.remove('open');$('#next').hidden=true;
  if(G.round>=4){finale();return;}
  G.round++;G.phase='reset';
  await tween(250,p=>A.ball.vis=1-p);resetActors();A.ball.vis=0;
  camTo({x:0,y:0,w:1600},800,E.io);
  await tween(350,p=>{A.ball.vis=p;A.ball.sc=E.back(p);});
  startRound();
};

/* ---------- finale + surprise ---------- */
async function finale(){
  G.mode='finale';G.phase='';hideRead();
  snd.whistle(3);snd.cheer(1.2,4.5);crowdParty(5000);led('ŠAMPION FRANTA');
  const fwT=setInterval(()=>{const p=w2s(150+Math.random()*1300,130+Math.random()*120);firework(p.x,p.y);},420);
  setTimeout(()=>clearInterval(fwT),5200);
  confetti(200);
  await tween(220,p=>A.boyB.flip=1-p,E.inq);
  A.boyB.vis=0;Object.assign(A.boyF,{vis:1,X:A.boyB.X,d:A.boyB.d,flip:0,wave:0,jump:0,cheer:0});
  tween(220,p=>A.boyF.flip=p,E.outq);
  cine(true);shake=.8;
  await camTo(faceFrame(A.boyF.X,A.boyF.d,300),1600,E.io);
  A.boyF.wave=1;
  await speak('Pět gólů, Františku! Jsi pravý abecední kanonýr. Mám pro tebe tajnou obálku.');
  A.boyF.wave=0;hideSubs();cine(false);shake=0;camTo(boyMedFrame(A.boyF.X,A.boyF.d,640),1200,E.io);
  showEnvelope();
}
const BOOT=`<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".45" stop-color="#ffc23a"/><stop offset="1" stop-color="#b47300"/></linearGradient></defs><circle cx="60" cy="60" r="56" fill="#0c1c40"/><circle cx="60" cy="60" r="50" fill="none" stroke="url(#gg)" stroke-width="4" stroke-dasharray="3 5"/><path d="M38 30 h24 v30 q0 6 6 8 l20 6 q10 3 10 12 v6 H30 q-6 0 -6 -6 v-8 q0 -6 6 -8 l8 -2z" fill="url(#gg)"/><path d="M30 92 h70 v6 H30z" fill="#b47300"/><g fill="#7a4d00"><circle cx="40" cy="100" r="3"/><circle cx="56" cy="100" r="3"/><circle cx="72" cy="100" r="3"/><circle cx="88" cy="100" r="3"/></g><path d="M44 44 l14 4 M44 52 l14 4" stroke="#fff6cf" stroke-width="3" stroke-linecap="round"/><path d="M92 22 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#fff6cf"/></svg>`;
function showEnvelope(){
  const f=$('#finale');f.hidden=false;
  f.innerHTML=`<div class="env"><h2>Tajná obálka</h2><p>Od trenéra Frantiho akademie. Klikni a otevři ji.</p>
  <button class="envBtn" id="envBtn" aria-label="Otevřít obálku"><svg viewBox="0 0 320 220"><rect x="10" y="30" width="300" height="180" rx="16" fill="#f5d27a"/><path d="M10 46 L160 140 L310 46 V194 q0 16 -16 16 H26 q-16 0 -16 -16Z" fill="#ffdf8f"/><path id="flap" d="M10 46 q0 -16 16 -16 h268 q16 0 16 16 L160 140Z" fill="#e9b949"/><circle cx="160" cy="132" r="26" fill="#e5383b"/><text x="160" y="143" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="30" fill="#fff">F</text></svg></button>
  <button class="btn gold" id="envOpen">Otevřít obálku</button></div>`;
  const open=()=>{snd.chime();showReward();};$('#envBtn').onclick=open;$('#envOpen').onclick=open;setTimeout(()=>$('#envOpen').focus(),100);
}
function showReward(){
  const f=$('#finale');const last=G.target||'Ž';
  f.innerHTML=`<article class="reward" aria-live="polite">
   <div class="rhead">${BOOT}<div><h2>Zlatá kopačka</h2><p>pro Františka · 5 gólů · ${G.letters} napsaných písmen abecedy až po ${last}</p></div></div>
   <section class="chal"><h3>Tvoje skutečná výzva: Abecední přihrávky</h3>
     <ol><li>Vezmi si míč a najdi zeď nebo parťáka.</li><li>Při každé přihrávce řekni nahlas další písmeno: A, Á, B, C…</li><li>Dokážeš dojít až k Ž? Když míč uteče, pokračuj tam, kde jsi skončil.</li></ol></section>
   <p class="bonus">Bonus: vymysli si vlastní gólovou oslavu a předveď ji doma.</p>
   <p class="champ" id="champ" hidden>Šampion! Jsi jednička na hřišti i v abecedě.</p>

  confetti(160);snd.win();
  $('#chDone').onclick=()=>{$('#champ').hidden=false;$('#chDone').disabled=true;confetti(220);snd.win();snd.cheer(1,3);crowdParty(3000);for(let i=0;i<5;i++)setTimeout(()=>firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.25)),i*300);};

function restart(){
  $('#finale').hidden=true;$('#finale').innerHTML='';parts=[];

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(G.mode==='intro'&&e.key==='Escape'){skipIntro();return;}

/* ---------- start ---------- */
$('#startBtn').onclick=()=>{snd.init();$('#gate').hidden=true;playIntro();};
/* gate camera drift */
let gateDrift=true;

function loop(now){

  if(G.mode==='gate'){cam.x=120+Math.sin(now/4000)*40;cam.w=1360;cam.y=60;}
